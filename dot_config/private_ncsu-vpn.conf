# ncsu-vpn configuration
#
# Holds no secrets -- your Unity password is never stored here. openconnect
# prompts for it on the terminal and reads it directly.

unity_id = bgreaves

# 1-Faculty-and-Staff is split tunnel; 6-Faculty-and-Staff-FT is full tunnel.
# Override per-connection with --group NAME or --full.
group = 1-Faculty-and-Staff

# Duo second factor: "push", or a passcode from the Duo Mobile app.
# Override per-connection with --duo 123456.
duo = push
